<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>现场打分平台</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="wrap">
    <h1 class="app">现场实时打分平台</h1>
    <p class="muted">在同一 Wi-Fi 下，用不同设备打开以下页面。手机扫码地址见管理后台。</p>
    <div class="card-box">
      <div class="row" style="flex-direction:column;align-items:stretch;gap:12px">
        <a class="btn primary" href="/screen" style="text-align:center;text-decoration:none">🖥️ 大屏显示（投影）</a>
        <a class="btn" href="/admin" style="text-align:center;text-decoration:none">⚙️ 管理后台</a>
        <a class="btn" href="/judge" style="text-align:center;text-decoration:none">📱 评委打分（手机扫码）</a>
        <a class="btn" href="/control" style="text-align:center;text-decoration:none">📱 手机控制切页（扫码）</a>
      </div>
    </div>
    <p class="muted">使用步骤：① 管理后台添加选手（名字+图片）和评委（名字+图片+密码）→ ② 用「手机控制台」选选手、切大屏页面、开始评分 → ③ 评委扫码，选名字输密码登录，数字键盘打分 → ④ 结束评分，切到排行榜。</p>
  </div>
</body>
</html>

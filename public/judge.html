<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>评委打分</title>
<meta name="theme-color" content="#0f1226">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="banner" class="banner"></div>
  <div class="wrap">

    <!-- 登录 -->
    <div id="loginBox" class="card-box">
      <h1 class="app">评委登录</h1>
      <label>选择评委</label>
      <select id="judgeSel"><option value="">加载中…</option></select>
      <label>密码</label>
      <input type="password" id="pwd" inputmode="numeric" placeholder="请输入密码">
      <button class="btn primary" id="loginBtn" style="width:100%;margin-top:16px">登 录</button>
      <p class="muted" id="loginMsg" style="margin-top:10px"></p>
    </div>

    <!-- 打分 -->
    <div id="scoreBox" style="display:none">
      <div class="card-box me-row" id="meRow"></div>
      <div class="card-box ct-card-big" id="ctCard"></div>
      <div class="card-box">
        <div class="score-display dim" id="scoreDisplay">--</div>
        <div class="keypad" id="keypad"></div>
        <button class="btn primary" id="submitBtn">打 分</button>
        <div class="my-score-tip" id="myScoreTip"></div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="/js/ws.js"></script>
  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = (id) => document.getElementById(id);
    let state = null;
    let me = null; // {id, name, avatar, type}
    let buf = '';  // 键盘输入缓冲

    try { me = JSON.parse(localStorage.getItem('judgeMe') || 'null'); } catch { me = null; }
    // 扫码专属链接 /judge?j=评委ID → 自动以该评委身份登录（只显示本人账号，无需密码）
    const autoJudgeId = new URLSearchParams(location.search).get('j');
    let autoResolved = false;

    // ---------- 登录 ----------
    function renderLoginSelect() {
      const sel = $('judgeSel');
      const prev = me ? me.id : sel.value;
      const visible = (state && state.judges.length)
        ? state.judges.filter(j => j.role === 'pro' || state.massEnabled)
        : [];
      sel.innerHTML = visible.length
        ? visible.map(j => `<option value="${esc(j.id)}">${esc(j.name)}（${j.role === 'mass' ? '大众评委' : '专业评委'}）</option>`).join('')
        : '<option value="">暂无评委，请联系管理员添加</option>';
      if (prev && state.judges.find(j => j.id === prev)) sel.value = prev;
    }

    $('loginBtn').addEventListener('click', async () => {
      const judgeId = $('judgeSel').value;
      const password = $('pwd').value;
      if (!judgeId) return toast('请选择评委', true);
      $('loginMsg').textContent = '登录中…';
      try {
        const r = await fetch('/api/judge/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ judgeId, password })
        });
        const j = await r.json();
        if (!j.ok) { $('loginMsg').textContent = j.error || '登录失败'; return; }
        me = j.judge;
        localStorage.setItem('judgeMe', JSON.stringify(me));
        $('loginMsg').textContent = '';
        render();
      } catch (e) { $('loginMsg').textContent = '网络错误'; }
    });
    $('pwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

    function logout() {
      me = null; localStorage.removeItem('judgeMe'); buf = '';
      render();
    }

    // ---------- 打分 ----------
    const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'];
    $('keypad').innerHTML = KEYS.map(k =>
      `<button data-k="${k}" class="${k === 'del' || k === '.' ? 'op' : ''}">${k === 'del' ? '删除' : k}</button>`).join('');
    $('keypad').addEventListener('click', (e) => {
      const k = e.target.getAttribute('data-k');
      if (!k) return;
      if (k === 'del') buf = buf.slice(0, -1);
      else if (k === '.') { if (!buf.includes('.')) buf = (buf || '0') + '.'; }
      else if (buf.replace('.', '').length < 5) buf += k;
      renderBuf();
    });

    function renderBuf() {
      const d = $('scoreDisplay');
      d.textContent = buf === '' ? '--' : buf;
      d.classList.toggle('dim', buf === '');
    }

    function currentContestant() {
      return state ? state.contestants.find(c => c.id === state.currentContestantId) : null;
    }

    function avatarOr(c, size) {
      return c.avatar ? `<img src="${esc(c.avatar)}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover">`
        : `<div style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#4f8cff,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:${size / 2}px;font-weight:800">${esc((c.name || '?').slice(0, 1))}</div>`;
    }

    function render() {
      $('loginBox').style.display = me ? 'none' : '';
      $('scoreBox').style.display = me ? '' : 'none';
      if (!state) return;
      if (!me) { renderLoginSelect(); updateBanner(); return; }

      $('meRow').innerHTML = `
        ${avatarOr(me, 46)}
        <div><div class="nm">${esc(me.name)}<span class="tag">${me.role === 'mass' ? '大众评委' : '专业评委'}</span></div></div>
        <button class="btn sm" id="logoutBtn" style="margin-left:auto">退出登录</button>`;
      $('logoutBtn').addEventListener('click', logout);

      const cur = currentContestant();
      $('ctCard').innerHTML = cur
        ? `${avatarOr(cur, 74)}<div><div class="n">${esc(cur.name)}</div>${cur.desc ? `<div class="d">${esc(cur.desc)}</div>` : ''}</div>`
        : `<div class="muted">等待主持人选择选手…</div>`;

      const list = (state.scores[cur && cur.id]) || [];
      const mine = me ? list.find(s => s.judgeId === me.id) : null;
      $('myScoreTip').textContent = mine ? `已打分：${Number(mine.score).toFixed(2)} 分（重新提交可修改）` : '';
      $('submitBtn').disabled = state.scoring !== 'active' || !cur;
      updateBanner();
      renderBuf();
    }

    function updateBanner() {
      const b = $('banner');
      b.className = 'banner';
      if (!state) return;
      if (state.scoring === 'active') { b.classList.add('show', 'active'); b.textContent = '评分进行中'; }
      else if (state.scoring === 'ended') { b.classList.add('show', 'ended'); b.textContent = '评分已结束'; }
      else { b.classList.add('show', 'idle'); b.textContent = '等待管理员开始评分…'; }
    }

    $('submitBtn').addEventListener('click', () => {
      const cur = currentContestant();
      if (!cur) return toast('暂无打分对象', true);
      if (buf === '' || isNaN(parseFloat(buf))) return toast('请先输入分数', true);
      sendWS({ type: 'submitScore', contestantId: cur.id, score: parseFloat(buf), judgeId: me.id });
    });

    window.onScoreResult = (m) => {
      if (m.ok) { toast('打分成功'); buf = ''; }
      else if (m.reason === 'not_active') toast('当前未开始打分', true);
      else if (m.reason === 'not_registered') { toast('评委信息已失效，请重新登录', true); logout(); }
      else if (m.reason === 'no_contestant') toast('暂无打分对象', true);
      else if (m.reason === 'mass_disabled') toast('大众评分未开启，无法提交', true);
      else if (m.reason === 'invalid') toast('分数超出范围', true);
    };

    function toast(msg, bad) {
      const t = $('toast');
      t.textContent = msg;
      t.style.background = bad ? '#d6455f' : '#34d399';
      t.style.color = bad ? '#fff' : '#062';
      t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1600);
    }

    connectState((st) => {
      state = st;
      if (autoJudgeId && !autoResolved) {
        autoResolved = true;
        const j = state.judges.find(x => x.id === autoJudgeId);
        if (j) {
          me = { id: j.id, name: j.name, avatar: j.avatar, role: j.role || 'pro' };
          localStorage.setItem('judgeMe', JSON.stringify(me));
        } else {
          $('loginMsg').textContent = '未找到该评委（可能已被删除）';
        }
      }
      render();
    });
  </script>
</body>
</html>
